name: Validate Dashboard

# Runs on every push and pull request to dev. Blocks merges/deploys if
# structural checks (see scripts/validate_dashboard.py) detect any of:
#   - orphan content outside section wrappers
#   - undefined CSS variable references
#   - broken JS getElementById references
#   - missing critical data-source URLs
#   - file size catastrophes
# Browser tests also cover tab navigation, Regime Check, and responsive overflow.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Run structural validator
        run: python scripts/validate_dashboard.py

      - name: Install test dependencies
        run: npm ci

      - name: Test market-data adapter
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test dashboard in browser
        run: npm run test:browser
